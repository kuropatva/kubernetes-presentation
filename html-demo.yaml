apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-demo
spec:
  replicas: 6
  selector:
    matchLabels:
      app: html-demo
  template:
    metadata:
      labels:
        app: html-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "<html>
              <body>
                <h1 style='color:red'>$POD_NAME</h1>
              </body>
              </html>" > /usr/share/nginx/html/index.html &&
              nginx -g 'daemon off;'
